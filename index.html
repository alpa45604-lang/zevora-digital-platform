<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070b"><meta name="description" content="ZEVORA — yayın hakkı doğrulanmış filmler.">
<title>ZEVORA</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#05070b;color:#f7f8fb;font-family:Arial,system-ui,sans-serif}header{height:68px;padding:0 5vw;display:flex;align-items:center;border-bottom:1px solid #ffffff18;background:#080b11}header b{font-size:22px;letter-spacing:.2em;color:#d5ff59}.hero{padding:24px 5vw 16px}.hero h1{font-size:12px;letter-spacing:.22em;color:#d5ff59;margin:0 0 12px}.trailer{width:100%;max-width:1100px;margin:auto;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden}.trailer iframe{width:100%;height:100%;border:0}.films{padding:20px 5vw 60px}.films h2{font-size:15px;letter-spacing:.12em;color:#c9d1dd;font-weight:600}.card{width:170px;cursor:pointer}.poster{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:12px;border:1px solid #ffffff20}.card strong{display:block;margin-top:9px;font-size:13px}.card small{display:block;margin-top:5px;color:#98a2b3;font-size:11px}.grid{display:flex;gap:18px;flex-wrap:wrap}.watch{display:none;position:fixed;inset:0;z-index:50;background:#000;align-items:center;justify-content:center;flex-direction:column}.watch.show{display:flex}.screen{width:100vw;height:100dvh;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#000}.screen iframe{width:100%;height:100%;border:0;transform:scale(var(--zoom,1));transform-origin:center}.controls{position:fixed;z-index:55;right:14px;top:14px;display:flex;gap:8px;align-items:center}.controls button{background:#171b22e8;color:#fff;border:1px solid #ffffff40;border-radius:9px;padding:10px 13px;font-size:15px}.controls .close{font-size:20px}.hint{position:fixed;left:12px;bottom:12px;color:#ffffff90;background:#1119;padding:8px 10px;border-radius:8px;font-size:10px}@media(max-width:600px){header{height:58px;padding:0 18px}.hero{padding:18px 12px 8px}.trailer{border-radius:8px}.films{padding:20px 16px}.card{width:calc(50% - 10px);max-width:170px}.controls{top:auto;bottom:18px;right:12px}.controls button{padding:11px 13px}.hint{bottom:75px}}
</style>
</head>
<body>
<header><b>ZEVORA</b></header>
<main>
<section class="hero"><h1>FRAGMAN</h1><div class="trailer"><iframe src="https://www.youtube-nocookie.com/embed/RzTg7YXuy34?rel=0" title="Sita Sings the Blues fragmanı" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div></section>
<section class="films"><h2>FİLMLER</h2><div class="grid"><article class="card" id="openFilm"><img class="poster" src="https://upload.wikimedia.org/wikipedia/commons/2/24/Sita_STB_Poster_Agni_A2.png" alt="Sita Sings the Blues afişi"><strong>Sita Sings the Blues</strong><small>2008 · 82 dakika · Orijinal ses</small></article></div></section>
</main>
<div class="watch" id="watch" aria-label="Film oynatıcı">
<div class="screen" id="screen"><iframe id="filmFrame" src="about:blank" title="Film oynatıcı" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe></div>
<div class="controls"><button id="zoomOut" aria-label="Uzaklaştır">−</button><button id="zoomIn" aria-label="Yakınlaştır">＋</button><button id="full" aria-label="Tam ekran">⛶</button><button class="close" id="close" aria-label="Kapat">×</button></div>
<div class="hint">Görüntü kalitesi, oynatıcının sunduğu kaynak seçeneklerinden seçilir.</div>
</div>
<script>
const watch=document.getElementById('watch'),screen=document.getElementById('screen'),frame=document.getElementById('filmFrame');let zoom=1;
document.getElementById('openFilm').addEventListener('click',()=>{zoom=1;screen.style.setProperty('--zoom',zoom);frame.src='https://archive.org/embed/Sita_Sings_the_Blues';watch.classList.add('show');document.body.style.overflow='hidden'});
document.getElementById('close').addEventListener('click',()=>{watch.classList.remove('show');frame.src='about:blank';document.body.style.overflow=''});
document.getElementById('zoomIn').addEventListener('click',()=>{zoom=Math.min(zoom+.1,1.8);screen.style.setProperty('--zoom',zoom)});
document.getElementById('zoomOut').addEventListener('click',()=>{zoom=Math.max(zoom-.1,1);screen.style.setProperty('--zoom',zoom)});
document.getElementById('full').addEventListener('click',()=>{if(!document.fullscreenElement){(screen.requestFullscreen||screen.webkitRequestFullscreen).call(screen)}else{(document.exitFullscreen||document.webkitExitFullscreen).call(document)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.fullscreenElement&&watch.classList.contains('show')){watch.classList.remove('show');frame.src='about:blank';document.body.style.overflow=''}});
</script>
</body></html>
